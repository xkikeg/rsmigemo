name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

# Third-party actions are pinned to a commit; Dependabot keeps them current.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --all-features
      - run: cargo clippy --all-targets --no-default-features

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: [default, --all-features, --no-default-features]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test ${{ matrix.features != 'default' && matrix.features || '' }}

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Public API, as docs.rs shows it.
      - run: cargo doc --no-deps --all-features
      # Internal docs (private items too), published to GitHub Pages from main.
      - run: >-
          cargo doc --no-deps --all-features --lib --document-private-items
          --target-dir target/internal-doc
        env:
          RUSTDOCFLAGS: -D warnings --html-before-content ${{ github.workspace }}/.github/pages/internal-banner.html
      - if: github.event_name == 'push'
        run: cp .github/pages/index.html target/internal-doc/doc/
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/internal-doc/doc

  pages:
    if: github.event_name == 'push'
    needs: doc
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}rsmigemo/
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  deny:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks: [advisories, bans licenses sources]
    # A new RustSec advisory shouldn't block unrelated PRs; it still shows as
    # a failed job.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check ${{ matrix.checks }}
