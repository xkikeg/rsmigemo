# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# RustSec advisories, including unmaintained and yanked crates.
unmaintained = "all"
yanked = "deny"

[licenses]
# Dependencies must allow distributing rsmigemo as MIT OR Apache-2.0.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
