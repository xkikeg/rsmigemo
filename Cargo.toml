[package]
name = "rsmigemo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Generate regular expressions that match Japanese text from romaji queries (a Rust port of C/Migemo)"
keywords = ["migemo", "japanese", "romaji", "regex", "search"]
categories = ["text-processing", "internationalization"]
exclude = ["DESIGN.md", "scripts/"]

[features]
default = ["embedded-tables"]
# Compile the four conversion tables (roma2hira, hira2kata, han2zen, zen2han) into the library.
embedded-tables = []
# Read `.zst`-compressed dictionaries.
zstd = ["dep:zstd"]

[dependencies]
encoding_rs = "0.8"
# `union` keeps a SmallVec of two edges as small as a Vec (24 bytes).
smallvec = { version = "1", features = ["union"] }
zstd = { version = "0.13", optional = true }
